# CD pipeline for the quotingo-gitops repo.
# Triggered by pushes to main under prod/**. Runs as the user-managed
# quotingo-cloudbuild service account configured on the trigger.

substitutions:
  _ZONE: us-central1-a
  _CLUSTER: quotingo-cluster
  _NAMESPACE: quotingo

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: get-credentials
    name: gcr.io/cloud-builders/gcloud
    args:
      - container
      - clusters
      - get-credentials
      - ${_CLUSTER}
      - --zone=${_ZONE}
      - --project=$PROJECT_ID

  # Apply the namespace first and wait for it to register, then apply
  # everything. On a fresh cluster, deployment/service creation can race
  # against namespace registration if both are in a single apply, so we
  # split them.
  - id: apply-namespace
    name: gcr.io/cloud-builders/kubectl
    env:
      - CLOUDSDK_COMPUTE_ZONE=${_ZONE}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        kubectl apply -f prod/namespace.yaml
        kubectl wait --for=jsonpath='{.status.phase}'=Active \
          namespace/${_NAMESPACE} --timeout=60s

  - id: apply-workload
    name: gcr.io/cloud-builders/kubectl
    env:
      - CLOUDSDK_COMPUTE_ZONE=${_ZONE}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}
    args: ["apply", "-f", "prod/"]

  - id: rollout
    name: gcr.io/cloud-builders/kubectl
    env:
      - CLOUDSDK_COMPUTE_ZONE=${_ZONE}
      - CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}
    args:
      - rollout
      - status
      - deployment/quotingo
      - -n
      - ${_NAMESPACE}
      - --timeout=120s

timeout: 600s
